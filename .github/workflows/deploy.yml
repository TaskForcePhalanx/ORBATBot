# Tests on every push and pull request; on main, then deploys to Railway.
#
# The deploy uses the Railway CLI and a project token, so it does not depend on
# Railway being able to see this repository (the Railway GitHub App). If the
# service is also connected to this repo in Railway, switch that connection off
# first — otherwise every push deploys twice.
#
# Needs, under Settings → Secrets and variables → Actions:
#   secret   RAILWAY_TOKEN     a *project* token (Railway: project → Settings → Tokens),
#                              created for the environment that runs the bot
#   variable RAILWAY_SERVICE   the bot service's name or id, as Railway shows it
# Without the token the deploy job is skipped, and the tests still run.

name: Test and deploy

on:
  push:
    branches: [main]
    # No paths-ignore for dashboard/**: the bot serves /stats from its own copy of
    # dashboard/ (web/killtracker.py), so a dashboard-only change has to deploy too.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time, and a newer push waits rather than cancelling a
    # deploy that is already uploading.
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - name: Check the deploy is configured
        id: configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE" ]; then
            echo "RAILWAY_TOKEN or RAILWAY_SERVICE is not set — skipping the deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Deploy to Railway
        if: steps.configured.outputs.ok == 'true'
        run: |
          npm install --global @railway/cli
          railway up --ci --service "$RAILWAY_SERVICE"

  # Portainer: build the image, publish it to GHCR and tell Portainer to pull it.
  # Inert until the secret PORTAINER_WEBHOOK (the stack's webhook URL) is set, so
  # it runs alongside the Railway deploy above during the move and does nothing
  # before it. Once Railway is switched off, delete the `deploy` job.
  portainer:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: portainer-deploy
      cancel-in-progress: false
    env:
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
    steps:
      - name: Check the deploy is configured
        id: configured
        run: |
          if [ -z "$PORTAINER_WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK is not set — skipping the Portainer deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.configured.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.configured.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.configured.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        if: steps.configured.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orbatbot:latest
            ghcr.io/${{ github.repository_owner }}/orbatbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tell Portainer to pull and restart
        if: steps.configured.outputs.ok == 'true'
        run: curl -fsS --retry 3 --max-time 60 -X POST "$PORTAINER_WEBHOOK"
